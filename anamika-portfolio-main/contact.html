    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        margin: 0;
      }

      header {
        background: #0a192f;
        padding: 18px 10%;
        display: flex;
        justify-content: space-between;
      }

      .logo {
        color: #64ffda;
        font-size: 26px;
        text-decoration: none;
        font-weight: bold;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }

      section {
        padding: 80px 10%;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;

        background: #0a192f;

  <body>
    <header>
      <a href="home.html" class="logo">Anamika</a>
      <nav>
        <a href="home.html">Home</a>

      <form>
