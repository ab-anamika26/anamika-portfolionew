<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anamika | Skills</title>

    <style>
      /* ===== RESET ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f5f7fa;
        color: #333;
      }

      /* ===== HEADER ===== */
      header {
        position: fixed;
        top: 0;
        width: 100%;
        height: 70px;
        background: #0a192f;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 10%;
      }

      .logo {
        color: #64ffda;
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
      }

      nav a:hover {
        color: #64ffda;
      }

      /* ===== SKILLS SECTION ===== */
      .skills {
        min-height: 100vh;
        padding: 120px 10%;
      }

      .skills h2 {
        text-align: center;
        font-size: 32px;
        color: #0a192f;
        margin-bottom: 40px;
      }

      .skill-box {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
      }

      .skill-card {
        background: white;
        padding: 20px;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        font-weight: bold;
        transition: transform 0.3s;
      }

      .skill-card:hover {
        transform: translateY(-5px);
        background: #64ffda;
        color: #0a192f;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 600px) {
        .skills {
          padding: 100px 5%;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <a href="#home" class="logo">Anamika</a>
      <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="achievments.html">achievments</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <!-- SKILLS SECTION -->
    <section class="skills">
      <h2>My Skills</h2>

      <div class="skill-box">
        <div class="skill-card">HTML</div>
        <div class="skill-card">CSS</div>
        <div class="skill-card">JavaScript</div>
        <div class="skill-card">Python</div>
      </div>
    </section>
  </body>
</html>
