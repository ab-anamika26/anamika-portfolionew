    <meta charset="UTF-8" />

    <title>Anamika | Portfolio</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        margin: 0;
      }

      header {
        background: #0a192f;
        padding: 18px 10%;
        display: flex;
        justify-content: space-between;
      }

      .logo {
        color: #64ffda;
        font-size: 26px;
        text-decoration: none;
        font-weight: bold;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }

      section {
        padding: 80px 10%;
      }

      .project {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
      }

      /* image styling */
      .about-container img {
        width: 260px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(10, 25, 47, 0.3);
        transition: transform 0.4s ease;
      }

      .about-container img:hover {
        transform: scale(1.05);
      }

      /* text content */
      .about-content h3 {
        font-size: 24px;
        color: #0a192f;
        margin-bottom: 15px;
      }

      .about-content p {
        font-size: 16px;
        line-height: 1.8;
        margin-bottom: 20px;
        color: #555;
      }

      /* highlights */
      .about-content span {
        color: #64ffda;
        font-weight: bold;
      }

      /* responsive */
      @media (max-width: 768px) {
        .about-container {
          flex-direction: column;
          text-align: center;
          padding: 30px;
        }
      }
    </style>
  </head>
